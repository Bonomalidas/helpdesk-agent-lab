# Assistant settings. Scenarios override some of these to inject misconfigurations.
kb_dirs: [kb]                  # folders of knowledge-base articles to index
chunk_size_words: 80
chunk_overlap_words: 20
top_k: 3
min_confidence: 0.10           # below this top score the assistant declines to answer
prefer_latest_on_conflict: false
normalize_args: true           # apply the per-tool argument normalizers from tools.yaml

servicenow:
  base_url: http://127.0.0.1:8099
  token: lab-valid-token       # override with SERVICENOW_TOKEN
  timeout_s: 2
  max_retries: 2               # retries after the first attempt (3 attempts total)
  backoff_s: 0.3
  max_retry_sleep_s: 1

llm:
  provider: offline            # offline | anthropic | openai
  model: claude-sonnet-5-5     # used by anthropic/openai providers (set to a model your key can use)
